server {
    listen 80;
    index index.php index.html;
    root /var/www/html/public;
    absolute_redirect off;

    # Backend API requests starting with /tracer-study/api/
    location ~ ^/tracer-study/api/(.*)$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param REQUEST_URI /api/$1;
        fastcgi_connect_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;
    }

    # Laravel storage access
    location ~ ^/tracer-study/storage/(.*)$ {
        alias /var/www/html/public/storage/$1;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
    }

    # Metabase, reverse-proxied under /tracer-study/metabase
    location ^~ /tracer-study/metabase/ {
        proxy_pass http://metabase:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    # Frontend React App under /tracer-study/
    location = /tracer-study {
        return 301 /tracer-study/;
    }

    location /tracer-study/ {
        alias /var/www/html/frontend/;
        try_files $uri $uri/ /tracer-study/index.html;
    }

    # Default fallback
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    client_max_body_size 512M;
}
