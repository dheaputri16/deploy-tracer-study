services:
    webserver:
        image: nginx:alpine
        container_name: tracer-nginx
        restart: unless-stopped
        tty: true
        ports:
            - "8102:80"
        volumes:
            - ./be-tracer-study:/var/www/html
            - ./fe-tracer-study/dist:/var/www/html/frontend
            - ./docker/nginx/conf.d:/etc/nginx/conf.d
        command: /bin/sh -c "rm -f /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
        networks:
            - app-network
        depends_on:
            - app

    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: tracer-app
        restart: unless-stopped
        tty: true
        working_dir: /var/www/html
        volumes:
            - ./be-tracer-study:/var/www/html
        networks:
            - app-network
        user: root
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            - DB_CONNECTION=oltp
            - OLTP_DB_HOST=db
            - OLTP_DB_PORT=5432
            - OLTP_DB_DATABASE=example
            - OLTP_DB_USERNAME=postgres
            - OLTP_DB_PASSWORD=postgres
            - OLAP_DB_HOST=db
            - OLAP_DB_PORT=5432
            - OLAP_DB_DATABASE=example
            - OLAP_DB_USERNAME=postgres
            - OLAP_DB_PASSWORD=postgres
            - REDIS_HOST=redis
            - CUBEJS_BASE_URL=http://cube:4000
            - CUBEJS_API_SECRET=05222880dfb93c7f4adc8554fecb93ed7469fc5274ad9909d23c396d4a55ee058736e54fe1dede9ffab7d8c690c8b311d78cef9d732bbe7ead2ee93d9cd499c7
        depends_on:
            - db
            - redis
            - cube

    db:
        image: postgres:15-alpine
        container_name: tracer-db
        restart: unless-stopped
        environment:
            POSTGRES_DB: example
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - "8103:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        networks:
            - app-network

    redis:
        image: redis:alpine
        container_name: tracer-redis
        restart: unless-stopped
        networks:
            - app-network

    cube:
        image: cubejs/cube:v1.6.47
        container_name: tracer-cube
        restart: unless-stopped
        ports:
            - "4000:4000"
            - "3000:3000"
        env_file: ./cube-tracer-study/.env
        environment:
            - CUBEJS_DB_HOST=db
            - CUBEJS_DB_PORT=5432
            - CUBEJS_DB_NAME=example
            - CUBEJS_DB_USER=postgres
            - CUBEJS_DB_PASS=postgres
        volumes:
            - ./cube-tracer-study:/cube/conf
            - .empty:/cube/conf/node_modules/@cubejs-backend/
        networks:
            - app-network
        depends_on:
            - db

    metabase:
        image: metabase/metabase:latest
        container_name: tracer-metabase
        restart: unless-stopped
        ports:
            - "8104:3000"
        environment:
            - MB_DB_TYPE=postgres
            - MB_DB_DBNAME=metabase_app
            - MB_DB_PORT=5432
            - MB_DB_USER=postgres
            - MB_DB_PASS=postgres
            - MB_DB_HOST=db
        networks:
            - app-network
        depends_on:
            - db

networks:
    app-network:
        driver: bridge

volumes:
    pgdata:
        driver: local
